<!doctype html>
<html lang="en">

<head>
    <style>
        @media print {
            .pagebreak {
                clear: both;
                page-break-after: always;
            }
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid rgb(241, 241, 241);
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px 15px 8px 15px;
            text-align: center;
        }

        thead {
            color: #fff;
            background-color: black;
        }


        hr {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 5px;
            border: none;
            height: 1px;
            background-color: #000;
        }

        .part {
            display: block;
        }

        .headertables {
            display: flex;
            justify-content: space-between;
            width: 100%
        }

        .report-title {
            font-style: normal;
            font-weight: 700;
            font-size: 18px;
            line-height: 135%;
            color: #171717;
        }

        .even-row {
            background-color: rgb(211, 211, 211);
        }

        .currency-list {
            display: flex;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .currency-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .currency-list ul li {
            margin-right: 10px;
        }

        .currency-list hr {
            border: none;
            border-top: 1px solid #666666;
            flex-grow: 1;
            margin-left: 10px;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 13px;
            margin: 0 48px;
        }
    </style>
</head>

        let sectionContainer = ``;

        function generateTableHeader() {
            html += `
        <thead>
            <tr>
                <th>No.</th>
                <th>User Id</th>
                <th>Processing Branch</th>
                <th>Date</th>
                <th>OMNI Ref No</th>
                <th>NTB/ETB</th>
                <th>Account Type</th>
                <th>Investor A/C No</th>
                <th>Investor Name & NRIC</th>
                <th>Payment Mode</th>
                <th>Payment Ref No</th>
                <th>Fund Name</th>
                <th>Currency</th>
                <th>Amount</th>
                <th>Sales Charge %</th>
                <th>Advisor Name & Code</th>
                <th>BDM</th>
                <th>Status</th>
                <th>Reroute/Rejection Reason</th>
            </tr>
        </thead>
    `;
        }
        function splitPaymentMode(data) {
            if (data.includes('TT')) {
                const parts = data.split(", ");
                partOne = parts[0]
                partTwo = parts[1]
                return `${partOne} <hr> ${partTwo}`
            }
            return data
        }

        function splitAndBreak(data) {
            const parts = data.split(", ");
            partOne = parts[0]
            partTwo = parts[1]
            return `${partOne} <hr> ${partTwo}`
        }

        function generateHtml(data) {
            const branches = new Set();
            const statuses = new Set();
            setTimeout(() => {
                if (branches) {
                    html += generateReportHeader(data, branches, statuses)
                }
            }, 0)

            const container = document.getElementById("container");
            for (const [dateString, transactionData] of Object.entries(data)) {
                if (dateString) {
                    html += `<p>${dateString}</p>`;
                    for (const [currency, currencySummary] of Object.entries(
                        transactionData
                    )) {
                        if (currencySummary?.length > 0) {
                            html += `<div class="currency-list"><ul><li>${currency.substring(0, 3).toUpperCase()}</li></ul><hr></div></div></div>`;
                            html += `<table>`
                            let headerGenerated = false;
                            if (!headerGenerated) {
                                generateTableHeader();
                                headerGenerated = true;
                            }
                            currencySummary.forEach((summary, index) => {

                                const {
                                    userId,
                                    name,
                                    lastUpdated,
                                    omniRef,
                                    processType,
                                    accountType,
                                    accountNo,
                                    paymentMethod,
                                    referenceNumber,
                                    fundName,
                                    investmentAmount,
                                    salesCharge,
                                    bdmName,
                                    status,
                                    jointClientName,
                                    jointClientNric,
                                    singleClientName,
                                    singleClientId,
                                    agentName,
                                    agentCode,
                                    statusRemark,
                                } = summary;
                                const paymentModeString = paymentMethod.includes('TT') ? `TT, ${paymentMethod}` : ` , ${paymentMethod}`
                                branches.add(name)
                                statuses.add(status)
                                let dateInDayMonthYear
                                if (lastUpdated) {
                                    const date = new Date(lastUpdated)
                                    dateInDayMonthYear = `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`
                                }

                                html += `
                            <tr>
                            <td>${index + 1}</td>
                            <td>${userId}</td>
                            <td>${name}</td>
                            <td>${dateInDayMonthYear}</td>
                            <td>${omniRef}</td>
                            <td>${processType}</td>
                            <td>${accountType}</td>
                            <td>${accountNo}</td>
                            <td>${jointClientName && jointClientNric
                                        ? splitAndBreak(`${singleClientName} ${singleClientId}, ${jointClientName} ${jointClientNric}`)
                                        : `${singleClientName} ${singleClientId}`} </td>
                            <td>${splitPaymentMode(paymentModeString)}</td >
                            <td>${splitAndBreak(`${referenceNumber ? referenceNumber : ''}, ${referenceNumber ? referenceNumber : ''}`)}</td>
                            <td>Kenanga Global Islamic Fund</td>
                            <td>MYR</td>
                            <td>20,000.00</td>
                            <td>${splitAndBreak(`${salesCharge}, ${salesCharge}`)}</td>
                            <td>${splitAndBreak(`${agentName}, ${agentCode}`)}</td>
                            <td>${splitAndBreak(`${bdmName}, ${bdmName}`)}</td>
                            <td id="originalContent5">${splitAndBreak(`${status}, ${status}`)}</td>
                                    <td td td id = "originalContent6" > ${splitAndBreak(`${statusRemark ?? '-'}, ${statusRemark ?? '-'}`)}</td >
                                <tr />
                                `;
                            });
                        }
                        html += `</table > `
                    }
                }

            }
            container.innerHTML += html;
        }

        getDateRange = (data) => {
            const dates = Object.keys(data)
            let intialDate;
            let lastDate;
            if (dates?.length) {
                intialDate = dates[0]
                lastDate = dates[dates.length - 1]
            }
            return { intialDate, lastDate }
        }

        function generateReportHeader(data, branches, statuses) {

            sectionContainer += `<p class="report-title" > Sales Submission Statistic Details Report</p >

                                        </tr>
                                        <tr>

        function groupDataByCurrency() {
            const data = { ...reportData }
            const groupedData = {}
            if (Object.keys.length > 0) {
                for (const [lastUpdated, transactionDataByCurrency] of Object.entries(data)) {
                    const dateString = lastUpdated
                    if (!groupedData[dateString]) {
                        groupedData[dateString] = {
                            usdMarket: [],
                            myrMarket: [],
                            eurMarket: [],
                            gbpMarket: [],
                            audMarket: [],
                            sgdMarket: [],
                            rmbMarket: [],
                            jpyMarket: [],
                        }
                    }
                    transactionDataByCurrency.forEach((sale) => {
                        this.classifySalesByCurrency(sale, groupedData, dateString)
                    })
                }
            }
            return groupedData
        }

        function classifySalesByCurrency(
            sale,
            groupedData,
            dateString
        ) {
            const salesByCurency = {
                myrMarket: 'myrMarket',
                usdMarket: 'usdMarket',
                eurMarket: 'eurMarket',
                gbpMarket: 'gbpMarket',
                audMarket: 'audMarket',
                sgdMarket: 'sgdMarket',
                rmbMarket: 'rmbMarket',
                jpyMarket: 'jpyMarket',
            }
            const currency = sale.currency.toUpperCase()
            let marketType
            const { myrMarket, usdMarket, eurMarket, gbpMarket, audMarket, sgdMarket, rmbMarket, jpyMarket } = salesByCurency
            switch (currency) {
                case 'USD':
                    marketType = usdMarket
                    break
                case 'MYR':
                    marketType = myrMarket
                    break
                case 'EUR':
                    marketType = eurMarket
                    break
                case 'GBP':
                    marketType = gbpMarket
                    break
                case 'AUD':
                    marketType = audMarket
                    break
                case 'SGD':
                    marketType = sgdMarket
                    break
                case 'RMB':
                    marketType = rmbMarket
                    break
                case 'JPY':
                    marketType = jpyMarket
                    break
                default:
                    break
            }

            if (marketType) {
                groupedData[dateString][marketType].push({
                    ...sale,
                    dateString,
                })
            }
            return groupedData
        }
        const data = groupDataByCurrency()
