            const container = document.getElementById("container");

                if (!groupedData[dateString]) {
                    groupedData[dateString] = {
                        moneyMarket: [],
                        nonMoneyMarket: []
                    };
                }

                entries.forEach((entry) => {
                    const branchKey = entry.branch + entry.currency;
                    if (entry.fundCategory === "Money Market") {
                        groupedData[dateString].moneyMarket.push(entry);
                    } else {
                        groupedData[dateString].nonMoneyMarket.push(entry);
                    }
                });
            }

        function generateTabele(data){

            container.innerHTML += html;
