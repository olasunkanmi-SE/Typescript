<!doctype html>
<html lang="en">

<head>
    <style>
        @media print {
            .page-break {
                clear: both;
                page-break-after: always;
                margin-top: 40px
            }
        }

        table {
            border-collapse: collapse;
            width: 100%;
            page-break-inside: avoid;
        }

        th,
        td {
            border: 1px solid rgb(241, 241, 241);
            border-collapse: collapse;
        }

        th {
            padding: 8px 15px 8px 15px;
        }

        td {
            padding: 0;
            text-align: center;
        }

        thead {
            color: #fff;
            background-color: black;
        }


        hr {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 5px;
            border: none;
            height: 1px;
            background-color: #000;
        }

        .part {
            display: block;
        }

        .headertables {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px
        }

        .report-title {
            font-style: normal;
            font-weight: 700;
            font-size: 20px;
            line-height: 135%;
            color: #171717;
        }

        .even-row {
            background-color: rgb(211, 211, 211);
        }

        .currency-list {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .currency-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .currency-list ul li {
            margin-right: 10px;
        }

        .currency-list hr {
            border: none;
            border-top: 1px solid #666666;
            flex-grow: 1;
            margin-left: 10px;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 11px;
            margin: 0 48px;
        }

        .table-row>td:first-child {
            border-left: 0.5px solid #333333;
        }

        .table-row>td:last-child {
            border-right: 0.5px solid #333333;
        }

        .table-row>td {
            border-top: 0.5px solid #333333;
        }

        .even-row {
            background-color: rgb(211, 211, 211);
        }

        .container {
            width: 100%;
        }

        .date_currency {
            font-size: 13px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .value {
            padding: 8px;
            border-bottom: 1px solid #bcbcbc;
            text-align: center;
        }

        .value:first-child {
            padding-top: 0;
        }

        .value:last-child {
            border-bottom: none;
        }
    </style>
</head>

            let sectionContainer = ``;

            function generateTableHeader() {
                html += `
        <thead>
            <tr>
                <th>No.</th>
                <th>User Id</th>
                <th>Processing Branch</th>
                <th>Date</th>
                <th>OMNI Ref No</th>
                <th>NTB/ETB</th>
                <th>Account Type</th>
                <th>Investor A/C No</th>
                <th>Investor Name & NRIC</th>
                <th>Payment Mode</th>
                <th>Payment Ref No</th>
                <th>Fund Name</th>
                <th>Currency</th>
                <th>Amount</th>
                <th>Sales Charge %</th>
                <th>Advisor Name & Code</th>
                <th>BDM</th>
                <th>Status</th>
                <th>Reroute/Rejection Reason</th>
            </tr>
        </thead>
    `;
            }
            function splitPaymentMode(data, paymentRefNo) {
                let paymentMode = [];
                if (data.includes('TT')) {
                    paymentMode.push(paymentRefNo);
                }
                if (data.includes('Cheque')) {
                    paymentMode.push(paymentRefNo);
                }
                return paymentMode;
            }

            function splitAndBreak(data) {
                let display
                if (data.includes(',')) {
                    display = data.split(", ");
                } else {
                    display = [data]
                }
                return display
            }

            function retrieveStatusRemarks(data) {
                let remarks = ''
                if (data?.length) {
                    let contentArrays = data.map(obj => obj.content);
                    let remarks = contentArrays.reduce((acc, arr) => acc.concat(arr), []);
                    return remarks.join(', ');
                }
                return remarks
            }

            function formatNRIC(nric) {
                let formatedNRIC = ''
                if (nric) {
                    formatedNRIC = `(${nric.slice(0, 6)}-${nric.slice(6, 8)}-${nric.slice(8)})`
                }
                return formatedNRIC;
            }

            function extractNameAndNric(arr) {
                if (arr?.length) {
                    let result = arr.map(str => {
                        let name = str.match(/[A-Za-z\s]+/)[0].trim();
                        let nricMatch = str.match(/\b\d{12}\b/);
                        let nricNumber = nricMatch ? nricMatch[0] : null;
                        return { name, nricNumber };
                    });
                    return result;
                }

            }


            function generateHtml(data) {
                const branches = new Set();
                const statuses = new Set();
                setTimeout(() => {
                    if (branches) {
                        html += generateReportHeader(data, branches, statuses)
                    }
                }, 0)

                const container = document.getElementById("container");
                for (const [dateString, transactionData] of Object.entries(data)) {
                    if (dateString) {
                        html += `<div class="date_currency"><p>${dateString}</p></div>`;
                        for (const [currency, currencySummary] of Object.entries(
                            transactionData
                        )) {
                            const transactionCurrency = currency.substring(0, 3).toUpperCase()
                            if (currencySummary?.length > 0) {
                                html += `<div class="page-break">`
                                html += `<div  class="currency-list date_currency"><ul><li>${transactionCurrency}</li></ul><hr></div>`;
                                html += `<table>`
                                let headerGenerated = false;
                                if (!headerGenerated) {
                                    generateTableHeader();
                                    headerGenerated = true;
                                }
                                currencySummary.forEach((summary, index) => {
                                    if (summary.userName) {
                                        username = summary.userName
                                    }
                                    const evenOddClass = index % 2 === 0 ? 'odd-row' : 'even-row';
                                    const {

                                        name,
                                        lastUpdated,
                                        omniRef,
                                        processType,
                                        accountType,
                                        accountNo,
                                        paymentMethod,
                                        referenceNumber,

                                        singleClientId,
                                        agentName,
                                        agentCode,
                                        statusRemarks,
                                    } = summary;

                                        ? [singleClientName, singleClientId, jointClientName, jointClientNric]
                                        : [singleClientName, singleClientId]
                                    const clientAndNric = extractNameAndNric()
                                    const paymentRefNo = splitAndBreak(`${referenceNumber ? referenceNumber : ''}, ${referenceNumber ? referenceNumber : ''}`)
                                    const transactionSalesCharge = splitAndBreak(`${salesCharge}, ${salesCharge}`)
                                    const agentInfo = splitAndBreak(`${agentName}, ${agentCode}`)
                                    const bdmInfo = splitAndBreak(`${bdmName}, ${bdmName}`)
                                    const statusInfo = splitAndBreak(`${status}, ${status}`)

                                    const paymentRefInfo = splitPaymentMode(paymentMethod, referenceNumber)
                                    branches.add(name)
                                    statuses.add(status)
                                    let dateInDayMonthYear
                                    if (lastUpdated) {
                                        const date = new Date(lastUpdated)
                                        dateInDayMonthYear = `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`
                                    }

                                    html += `
                            <tr style="height: 80px;" class=${evenOddClass}>
                            <td>${index + 1}</td>
                            <td>${userId || ""}</td>
                            <td>${name}</td>
                            <td>${dateInDayMonthYear}</td>
                            <td>${omniRef}</td>
                            <td>${processType}</td>
                            <td>${accountType}</td>
                            <td>${accountNo}</td>
                            <td><div class="value" style="border-bottom: none">${clients[0] || ""}</div>
                                <div class="value">${formatNRIC(clients[1]) || ""}</div >
                                    <div class="value" style="border-bottom: none">${clients[0] || ""}</div>
                                <div class="value">${clients[1] || ""}</div >
                            </td >
                            <td><div class="value">TT</div>
                            <div class="value">Cheque</div></td>
                            <td><div class="value" >${paymentRefInfo[0] || ""}</div>
                                <div class="value">${paymentRefInfo[1] || ""}</div></td>
                            <td>${fundName}</td>
                            <td>${transactionCurrency}</td>
                            <td>${investmentAmount}</td>
                            <td><div class="value" >${transactionSalesCharge[0] || ""}</div>
                                <div class="value">${transactionSalesCharge[1] || ""}</div></td></td >
                            <td><div class="value" >${agentInfo[0] || ""}</div>
                                <div class="value">${agentInfo[1] || ""}</div></td>
                            <td><div class="value" >${bdmInfo[0] || ""}</div>
                                <div class="value">${bdmInfo[1] || ""}</div></td>
                            <td id="originalContent5"><div class="value" >${statusInfo[0] || ""}</div>
                                <div class="value">${statusInfo[1] || ""}</div></td>
                            <td><div class="value">${remarks}</div></td >
                                <tr />
                                `;
                                });
                            }
                            html += `</table ></div > `
                        }
                    }

                }
                container.innerHTML += html;
            }

            getDateRange = (data) => {
                const dates = Object.keys(data)
                let intialDate;
                let lastDate;
                if (dates?.length) {
                    intialDate = dates[0]
                    lastDate = dates[dates.length - 1]
                }
                return { intialDate, lastDate }
            }

            function generateReportHeader(data, branches, statuses) {

                                            </tr>
                                        </table>
                                    </div>`;
                generalInfoSection.innerHTML += sectionContainer;
            }

            function groupDataByCurrency() {
                const data = { ...reportData }
                const groupedData = {}
                if (Object.keys.length > 0) {
                    for (const [lastUpdated, transactionDataByCurrency] of Object.entries(data)) {
                        const dateString = lastUpdated
                        if (!groupedData[dateString]) {
                            groupedData[dateString] = {
                                usdMarket: [],
                                myrMarket: [],
                                eurMarket: [],
                                gbpMarket: [],
                                audMarket: [],
                                sgdMarket: [],
                                rmbMarket: [],
                                jpyMarket: [],
                            }
                        }
                        transactionDataByCurrency.forEach((sale) => {
                            this.classifySalesByCurrency(sale, groupedData, dateString)
                        })
                    }
                }
                return groupedData
            }

            function classifySalesByCurrency(
                sale,
                groupedData,
                dateString
            ) {
                const salesByCurency = {
                    myrMarket: 'myrMarket',
                    usdMarket: 'usdMarket',
                    eurMarket: 'eurMarket',
                    gbpMarket: 'gbpMarket',
                    audMarket: 'audMarket',
                    sgdMarket: 'sgdMarket',
                    rmbMarket: 'rmbMarket',
                    jpyMarket: 'jpyMarket',
                }
                const currency = sale.currency.toUpperCase()
                let marketType
                const { myrMarket, usdMarket, eurMarket, gbpMarket, audMarket, sgdMarket, rmbMarket, jpyMarket } = salesByCurency
                switch (currency) {
                    case 'USD':
                        marketType = usdMarket
                        break
                    case 'MYR':
                        marketType = myrMarket
                        break
                    case 'EUR':
                        marketType = eurMarket
                        break
                    case 'GBP':
                        marketType = gbpMarket
                        break
                    case 'AUD':
                        marketType = audMarket
                        break
                    case 'SGD':
                        marketType = sgdMarket
                        break
                    case 'RMB':
                        marketType = rmbMarket
                        break
                    case 'JPY':
                        marketType = jpyMarket
                        break
                    default:
                        break
                }

                if (marketType) {
                    groupedData[dateString][marketType].push({
                        ...sale,
                        dateString,
                    })
                }
                return groupedData
            }
            const data = groupDataByCurrency()
            generateHtml(data);
