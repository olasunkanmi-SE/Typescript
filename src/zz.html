<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        @media print {
            .page-break {
                clear: both;
                page-break-after: always;
            }
        }

        @page {
            margin-top: 70px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            page-break-inside: always;
        }

        th,
        td {
            border: 1px solid rgb(241, 241, 241);
            border-collapse: collapse;
        }

        th {
            padding: 8px 15px 8px 15px;
        }

        td {
            padding: 0;
            text-align: center;
        }

        tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        thead {
            color: #fff;
            background-color: black;
        }

        hr {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 5px;
            border: none;
            height: 1px;
            background-color: #000;
        }

        .part {
            display: block;
        }

        .headertables {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px;
        }

        .report-title {
            font-style: normal;
            font-weight: 700;
            font-size: 20px;
            line-height: 135%;
            color: #171717;
        }

        .even-row {
            background-color: rgb(211, 211, 211);
        }

        .currency-list {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .currency-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .currency-list ul li {
            margin-right: 10px;
        }

        .currency-list hr {
            border: none;
            border-top: 1px solid #666666;
            flex-grow: 1;
            margin-left: 10px;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 11px;
            margin: 0 48px;
        }

        .table-row>td:first-child {
            border-left: 0.5px solid #333333;
        }

        .table-row>td:last-child {
            border-right: 0.5px solid #333333;
        }

        .table-row>td {
            border-top: 0.5px solid #333333;
        }

        .even-row {
            background-color: rgb(211, 211, 211);
        }

        .container {
            width: 100%;
        }

        .date-currency {
            font-size: 13px;
        }

        .value {
            padding: 8px;
            border-bottom: 1px solid #bcbcbc;
            text-align: center;
        }

        .value:first-child {
            padding-top: 0;
        }

        .value:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: bold;
        }

        .remarks {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

            function splitPaymentMode(data, paymentRefNo) {
                let paymentMode = [];
                if (data.includes('TT')) {
                    paymentMode.push(paymentRefNo);
                }
                if (data.includes('Cheque')) {
                    paymentMode.push(paymentRefNo);
                }
                return paymentMode;
            }

            function splitAndBreak(data) {
                let display
                if (data.includes(',')) {
                    display = data.split(", ");
                } else {
                    display = [data]
                }
                return display
            }

            function retrieveStatusRemarks(data) {
                let reportRemarks = ''
                if (data?.length) {
                    dataToArray = JSON.parse(data)
                    let contentArrays = dataToArray.map(obj => obj.content);
                    let remarks = contentArrays.reduce((acc, arr) => acc.concat(arr), []);
                    remarks = remarks.join(', ');
                    let maxLength = 50;
                    let chunks = [];
                    for (let i = 0; i < remarks.length; i += maxLength) {
                        chunks.push(remarks.substring(i, i + maxLength));
                    }
                    if (chunks.length) {
                        reportRemarks = chunks.join("\n")
                    }
                }
                return reportRemarks;
            }

            function formatNRIC(nric) {
                let formatedNRIC = ''
                if (nric) {
                    formatedNRIC = `(${nric.slice(0, 6)}-${nric.slice(6, 8)}-${nric.slice(8)})`
                }
                return formatedNRIC
            }

            function generateHtml(data) {

                                    generateTableHeader();
                                    headerGenerated = true;
                                }

                                  <td><div class="value name" >${agentInfo[0] || ""}</div>

                                  <td><div class="value name" >${bdmInfo[0] || ""}</div>

                                  <td id="originalContent5"><div class="value" >${statusInfo[0] || ""}</div>
                                      <div class="value">${statusInfo[1] || ""}</div></td>

            const reportMetaData = (data) => {
                let dateRange
                let branches

                for (const [dateString, statisticsData] of Object.entries(data)) {
                    statisticsData.forEach((data) => {
                        if (data?.dateRange?.length) dateRange = data.dateRange
                        if (data?.branches?.length) branches = data.branches
                        if (data?.statuses?.length) statuses = data.statuses
                    })
                    if (dateRange && branches && statuses) {

                    }
                }
                const range = parseDateRange(dateRange)
                return [range, branches, statuses]

            parseDateRange = (dateString) => {

            function groupDataByCurrency() {
                const data = { ...reportData }
                const groupedData = {}
                if (Object.keys.length > 0) {
                    for (const [lastUpdated, transactionDataByCurrency] of Object.entries(data)) {
                        const dateString = lastUpdated
                        if (!groupedData[dateString]) {
                            groupedData[dateString] = {
                                usdMarket: [],
                                myrMarket: [],
                                eurMarket: [],
                                gbpMarket: [],
                                audMarket: [],
                                sgdMarket: [],
                                rmbMarket: [],
                                jpyMarket: [],
                            }
                        }
                        transactionDataByCurrency.forEach((sale) => {
                            this.classifySalesByCurrency(sale, groupedData, dateString)
                        })
                    }
                }
                return groupedData
            }

            function classifySalesByCurrency(
                sale,
                groupedData,
                dateString
            ) {
                const salesByCurency = {
                    myrMarket: 'myrMarket',
                    usdMarket: 'usdMarket',
                    eurMarket: 'eurMarket',
                    gbpMarket: 'gbpMarket',
                    audMarket: 'audMarket',
                    sgdMarket: 'sgdMarket',
                    rmbMarket: 'rmbMarket',
                    jpyMarket: 'jpyMarket',
                }
                const currency = sale.currency.toUpperCase()
                let marketType
                const { myrMarket, usdMarket, eurMarket, gbpMarket, audMarket, sgdMarket, rmbMarket, jpyMarket } = salesByCurency
                switch (currency) {
                    case 'USD':
                        marketType = usdMarket
                        break
                    case 'MYR':
                        marketType = myrMarket
                        break
                    case 'EUR':
                        marketType = eurMarket
                        break
                    case 'GBP':
                        marketType = gbpMarket
                        break
                    case 'AUD':
                        marketType = audMarket
                        break
                    case 'SGD':
                        marketType = sgdMarket
                        break
                    case 'RMB':
                        marketType = rmbMarket
                        break
                    case 'JPY':
                        marketType = jpyMarket
                        break
                    default:
                        break
                }

                if (marketType) {
                    groupedData[dateString][marketType].push({
                        ...sale,
                        dateString,
                    })
                }
                return groupedData
            }
            const data = groupDataByCurrency()
            generateHtml(data);
