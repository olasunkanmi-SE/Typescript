      const allData = [];
      function populateTables(data) {
        const container = document.getElementById("container");
        const groupedData = {};
        for (const [lastUpdated, entries] of Object.entries(data)) {
          const dateString = lastUpdated;

          if (!groupedData[dateString]) {
            groupedData[dateString] = {
              moneyUsdMarket: [],
              nonMoneyUsdMarket: [],
              moneyMyrMarket: [],
              nonMoneyMyrMarket: [],
            };
          }
          entries.forEach((entry) => {
            const branchKey = entry.branch + entry.currency;
            if (
              entry.fundCategory === "Money Market" &&
              entry.currency.toUpperCase() === "USD"
            ) {
              groupedData[dateString].moneyUsdMarket.push({
                ...entry,
                dateString,
              });
            }
            if (
              entry.fundCategory === "Money Market" &&
              entry.currency.toUpperCase() === "MYR"
            ) {
              groupedData[dateString].moneyMyrMarket.push({
                ...entry,
                dateString,
              });
            }
            if (
              entry.fundCategory === "Non Money Market" &&
              entry.currency.toUpperCase() === "USD"
            ) {
              groupedData[dateString].nonMoneyUsdMarket.push({
                ...entry,
                dateString,
              });
            }
            if (
              entry.fundCategory === "Non Money Market" &&
              entry.currency.toUpperCase() === "MYR"
            ) {
              groupedData[dateString].nonMoneyMyrMarket.push({
                ...entry,
                dateString,
              });
            }
          });
        }

        // Reusable function to process market data and generate HTML
        function processMarketData(dateString, marketData, marketType) {
          const marketObj = {};
          marketData.forEach((entry) => {
            const branchKey = entry.branch + entry.currency;
            if (!marketObj[dateString]) {
              marketObj[dateString] = {};
            }
            if (!marketObj[dateString][branchKey]) {
              marketObj[dateString][branchKey] = {
                marketType,
                branch: entry.branch,
                currency: entry.currency,
                totalCases: 0,
                totalAmount: 0,
                EPFKIBCases: 0,
                EPFKIBAmount: 0,
                EPFThirdPartyCases: 0,
                EPFThirdPartyAmount: 0,
                CASHKIBCases: 0,
                CASHKIBAmount: 0,
                CASHThirdPartyCases: 0,
                CASHThirdPartyAmount: 0,
                PRSKIBCases: 0,
                PRSKIBAmount: 0,
                PRSThirdPartyCases: 0,
                PRSThirdPartyAmount: 0,
              };
            }
            if (entry.fundType === "PRS") {
              if (entry.issuingHouse === "KIB") {
                marketObj[dateString][branchKey].PRSKIBCases++;
                marketObj[dateString][branchKey].PRSKIBAmount +=
                  entry.investmentAmount;
              } else if (entry.issuingHouse === "3RD PARTY") {
                marketObj[dateString][branchKey].PRSThirdPartyCases++;
                marketObj[dateString][branchKey].PRSThirdPartyAmount +=
                  entry.investmentAmount;
              }
            } else {
              if (entry.paymentMethod === "EPF") {
                if (entry.issuingHouse === "KIB") {
                  marketObj[dateString][branchKey].EPFKIBCases++;
                  marketObj[dateString][branchKey].EPFKIBAmount +=
                    entry.investmentAmount;
                } else if (entry.issuingHouse === "3RD PARTY") {
                  marketObj[dateString][branchKey].EPFThirdPartyCases++;
                  marketObj[dateString][branchKey].EPFThirdPartyAmount +=
                    entry.investmentAmount;
                }
              }
              if (entry.paymentMethod === "CASH") {
                if (entry.issuingHouse === "KIB") {
                  marketObj[dateString][branchKey].CASHKIBCases++;
                  marketObj[dateString][branchKey].CASHKIBAmount +=
                    entry.investmentAmount;
                } else if (entry.issuingHouse === "3RD PARTY") {
                  marketObj[dateString][branchKey].CASHThirdPartyCases++;
                  marketObj[dateString][branchKey].CASHThirdPartyAmount +=
                    entry.investmentAmount;
                }
              }
            }
          });
          allData.push(marketObj);
          return marketObj;
        }

        function processAllMarketData(groupedData, marketType) {
          for (const [dateString, market] of Object.entries(groupedData)) {
            const marketData = market[marketType];
            if (marketData.length) {
              processMarketData(dateString, marketData, marketType);
            }
          }
        }
        // Process and generate HTML for each market type
        processAllMarketData(groupedData, "nonMoneyMyrMarket");
        processAllMarketData(groupedData, "nonMoneyUsdMarket");
        processAllMarketData(groupedData, "moneyMyrMarket");
        processAllMarketData(groupedData, "moneyUsdMarket");
        buildDataAndGenerateHtml(data);
      }

      function sortDataDescending(data) {
        const groupedData = {};
        data.forEach((item) => {
          const date = Object.keys(item)[0];
          if (groupedData[date]) {
            groupedData[date].push(item);
          } else {
            groupedData[date] = [item];
          }
        });

        const sortedArray = Object.values(groupedData).sort((a, b) => {
          const dateA = Object.keys(b[0])[0].split("/").reverse().join("-");
          const dateB = Object.keys(a[0])[0].split("/").reverse().join("-");
          return new Date(dateB) - new Date(dateA);
        });
        const flattenedArray = sortedArray.flatMap((arr) => arr);
        return flattenedArray.reverse();
      }

      function buildDataAndGenerateHtml(initData) {
        const sortedData = sortDataDescending(allData);
        if (sortedData?.length) {
          console.log(sortedData)
          sortedData.forEach((data) => {
            const keys = Object.keys(data);
            const dataKey = keys[0];
            const marketType =
              data[dataKey][Object.keys(data[dataKey])[0]].marketType;
            if (marketType) {
              const headerSectionProps = getEarliestAndLatestDatesWithUniqueBranches(initData)
              generateHtml(data, marketType, headerSectionProps);
            }
          });
        }
      }

      function getEarliestAndLatestDatesWithUniqueBranches(data) {
      let dates = Object.keys(data)
      dates.sort((a, b) => new Date(a.split('/').reverse().join('-')).getTime()
        - new Date(b.split('/').reverse().join('-')).getTime())
      let allBranches = []
      for (let date in data) {
        data[date].forEach((branch) => {
          if (!allBranches.includes(branch.branch)) {
            allBranches.push(branch.branch)
          }
        })
      }
      let earliestDate = dates[0]
      let latestDate = dates[dates.length - 1]
      return { earliestDate, latestDate, uniqueBranches: allBranches }
    }

                        totalPRSThirdPartyCases += parseInt(branch.PRSThirdPartyCases);
                        totalPRSThirdPartyAmount += parseFloat(branch.PRSThirdPartyAmount);
          }
          html += `<tr>
                            <td colspan="2">Total</td>
                            <td>${totalEPFKIBCases}</td>

          container.innerHTML += html;
        }
      }
