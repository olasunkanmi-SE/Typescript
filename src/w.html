            const container = document.getElementById('container')

                        nonMoneyUsdMarket: [],
                        moneyMyrMarket: [],
                        nonMoneyMyrMarket: [],
                        moneyEurMarket: [],
                        nonMoneyEurMarket: [],

                        nonMoneyGpbMarket: [],

                        nonMoneyAudMarket: [],

                        nonMoneySgdMarket: [],
                        moneyRmbMarket: [],
                        nonMoneyRmbMarket: [],
                        moneyJpyMarket: [],
                        nonMoneyJpyMarket: [],
                    }
                }
                salesSummary.forEach((sale) => {
                    const branchKey = sale.branch + sale.currency
                    classifySalesByMarketType(sale, groupedData, dateString)
                })

            // Reusable function to process market data and generate HTML
            function processMarketData(dateString, marketData, marketType) {
                const marketObj = {}
                marketData.forEach((entry) => {
                    const branchKey = entry.branch + entry.currency
                    if (!marketObj[dateString]) {
                        marketObj[dateString] = {}
                    }
                    if (!marketObj[dateString][branchKey]) {
                        marketObj[dateString][branchKey] = {
                            marketType,
                            branch: entry.branch,
                            currency: entry.currency,
                            totalCases: 0,
                            totalAmount: 0,
                            EPFKIBCases: 0,
                            EPFKIBAmount: 0,
                            EPFThirdPartyCases: 0,
                            EPFThirdPartyAmount: 0,
                            CASHKIBCases: 0,
                            CASHKIBAmount: 0,
                            CASHThirdPartyCases: 0,
                            CASHThirdPartyAmount: 0,
                            PRSKIBCases: 0,
                            PRSKIBAmount: 0,
                            PRSThirdPartyCases: 0,
                            PRSThirdPartyAmount: 0,
                        }
                    }
                    if (entry.fundType === 'PRS') {
                        if (entry.issuingHouse === 'KIB') {
                            marketObj[dateString][branchKey].PRSKIBCases++
                            marketObj[dateString][branchKey].PRSKIBAmount += entry.investmentAmount
                        } else if (entry.issuingHouse === '3RD PARTY') {
                            marketObj[dateString][branchKey].PRSThirdPartyCases++
                            marketObj[dateString][branchKey].PRSThirdPartyAmount += entry.investmentAmount
                        }
                    } else {
                        if (entry.paymentMethod === 'EPF') {
                            if (entry.issuingHouse === 'KIB') {
                                marketObj[dateString][branchKey].EPFKIBCases++
                                marketObj[dateString][branchKey].EPFKIBAmount += entry.investmentAmount
                            } else if (entry.issuingHouse === '3RD PARTY') {
                                marketObj[dateString][branchKey].EPFThirdPartyCases++
                                marketObj[dateString][branchKey].EPFThirdPartyAmount += entry.investmentAmount
                            }
                        }
                        if (entry.paymentMethod === 'CASH') {
                            if (entry.issuingHouse === 'KIB') {
                                marketObj[dateString][branchKey].CASHKIBCases++
                                marketObj[dateString][branchKey].CASHKIBAmount += entry.investmentAmount
                            } else if (entry.issuingHouse === '3RD PARTY') {
                                marketObj[dateString][branchKey].CASHThirdPartyCases++
                                marketObj[dateString][branchKey].CASHThirdPartyAmount += entry.investmentAmount
                            }
                        }
                    }
                })
                allData.push(marketObj)
                return marketObj
            }

            function processAllMarketData(groupedData, marketType) {
                for (const [dateString, market] of Object.entries(groupedData)) {
                    const marketData = market[marketType]

                        processMarketData(dateString, marketData, marketType)
                    }
                }

        function sortDataDescending(data) {
            const groupedData = {}
            data.forEach((item) => {
                const date = Object.keys(item)[0]
                if (groupedData[date]) {
                    groupedData[date].push(item)
                } else {
                    groupedData[date] = [item]
                }
            })

            const sortedArray = Object.values(groupedData).sort((a, b) => {
                const dateA = Object.keys(b[0])[0].split('/').reverse().join('-')
                const dateB = Object.keys(a[0])[0].split('/').reverse().join('-')
                return new Date(dateB) - new Date(dateA)
            })
            const flattenedArray = sortedArray.flatMap((arr) => arr)
            return flattenedArray.reverse()
        }

        function buildDataAndGenerateHtml() {
            const sortedData = sortDataDescending(allData)
            if (sortedData?.length) {
                sortedData.forEach((data) => {
                    const keys = Object.keys(data)
                    const dataKey = keys[0]
                    const marketType = data[dataKey][Object.keys(data[dataKey])[0]].marketType
                    if (marketType) {
                        generateHtml(data, marketType)
                    }
                })
            }
        }

        const getEarliestAndLatestDateAndBranches = () => {
            let dates = new Set();
            let uniqueBranches = new Set();
            const sortedData = sortDataDescending(allData);
            let earliestDate;
            let latestDate;
            let allBranches;

            sortedData.forEach((data) => {
                for (const [dateString, branches] of Object.entries(data)) {
                    dates.add(dateString);
                    for (const [branch, marketInfo] of Object.entries(branches)) {
                        uniqueBranches.add(marketInfo.branch);
                    }
                }
                const range = [...dates];
                const branches = [...uniqueBranches];
                (earliestDate = range[0]),
                    (latestDate = range[range.length - 1]),
                    (allBranches = branches.join(', '));
            });
            return {
                earliestDate,
                latestDate,
                allBranches,
            };
        };

        function classifySalesByMarketType(sale, groupedData, dateString) {
            const category = sale.fundCategory;
            const currency = sale.currency.toUpperCase();
            let marketType;
            switch (category) {
                case 'Money Market':
                    switch (currency) {
                        case 'USD':
                            marketType = 'moneyUsdMarket';
                            break;
                        case 'MYR':
                            marketType = 'moneyMyrMarket';
                            break;
                        case 'EUR':
                            marketType = 'moneyEurMarket';
                            break;
                        case 'GBP':
                            marketType = 'moneyGbpMarket';
                            break;
                        case 'AUD':
                            marketType = 'moneyAudMarket';
                            break;
                        case 'SGD':
                            marketType = 'moneySgdMarket';
                            break;
                        case 'RMB':
                            marketType = 'moneyRmbMarket';
                            break;
                        case 'JPY':
                            marketType = 'moneyJpyMarket';
                            break;
                    }
                    break;
                case 'Non Money Market':
                    switch (currency) {
                        case 'USD':
                            marketType = 'nonMoneyUsdMarket';
                            break;
                        case 'MYR':
                            marketType = 'nonMoneyMyrMarket';
                            break;
                        case 'EUR':

                            break;
                        case 'GBP':

                        case 'AUD':

                        case 'SGD':

                        case 'RMB':

                            break;
                        case 'JPY':
                            marketType = 'nonMoneyJpyMarket';
                            break;
                    }
                    break;
            }

            if (marketType) {
                groupedData[dateString][marketType].push({
                    ...sale,
                    dateString,
                });
            }
