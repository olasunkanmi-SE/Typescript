// Function to generate table based on the provided data
function generateTable(data) {
  let html = `<h2>Date: ${data.date}</h2>`;
  html += "<p>MYR</p>";
  html += `<table>
            <tr>
              <th style="background-color: #000; color: #fff;">No.</th>
              <th style="background-color: #000; color: #fff;">Processing Branch</th>
              <th style="background-color: #000; color: #fff;" colspan="2">EPF</th>
              <th style="background-color: #000; color: #fff;" colspan="2">CASH</th>
              <th style="background-color: #000; color: #fff;" colspan="2">PRS</th>
            </tr>
            <tr>
              <th></th>
              <th></th>
              <th>KIB</th>
              <th>3rd Party</th>
              <th>KIB</th>
              <th>3rd Party</th>
              <th>KIB</th>
              <th>3rd Party</th>
            </tr>
            <tr>
              <th></th>
              <th></th>
              <th>No. of cases</th>
              <th>Amount</th>
              <th>No. of cases</th>
              <th>Amount</th>
              <th>No. of cases</th>
              <th>Amount</th>
            </tr>`;
  
  for (let i = 0; i < data.data.nonMoneyMarket.MYR["HQ - Kuala Lumpur"].length; i++) {
    const investment = data.data.nonMoneyMarket.MYR["HQ - Kuala Lumpur"][i];
    const investmentAmount = investment.CASH ? investment.CASH.investmentAmount : (investment.EPF ? investment.EPF.investmentAmount : (investment.PRS ? investment.PRS.investmentAmount : 0));
    const cases = investment.CASH ? "1" : (investment.EPF ? "1" : (investment.PRS ? "1" : "0"));
    const branchName = "HQ - Kuala Lumpur";
    
    html += `<tr>
                <td>${i + 1}</td>
                <td>${branchName}</td>
                <td>${investment.EPF && investment.EPF.KIB ? cases : ""}</td>
                <td>${investment.EPF && investment.EPF.KIB ? investmentAmount : ""}</td>
                <td>${investment.CASH && investment.CASH.KIB ? cases : ""}</td>
                <td>${investment.CASH && investment.CASH.KIB ? investmentAmount : ""}</td>
                <td>${investment.PRS && investment.PRS.KIB ? cases : ""}</td>
                <td>${investment.PRS && investment.PRS.KIB ? investmentAmount : ""}</td>
             </tr>`;
  }
  
  html += `</table>`;
  return html;
}

// Function to render tables for each data entry
function renderTables(data) {
  const container = document.getElementById("container");
  let tablesHTML = "";
  data.forEach(entry => {
    tablesHTML += generateTable(entry);
  });
  container.innerHTML = tablesHTML;
}
